name: Bug report
description: Report a reproducible parsing, routing, rendering or packaging problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please write in English and include the smallest source that reproduces the problem.
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Include UarchDraw version or commit, Node.js version and operating system.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal .uarch source
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and steps to reproduce
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and artifacts
      description: Include the error, diagnostic or geometry report, and an SVG/PNG screenshot when useful. Remove private paths or design content.
    validations:
      required: true
